<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="EggSys website status from Theegget Creations.">
  <title>TCStatus — Theegget Creations</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Theegget Creations">
      <span class="brand-mark">TC</span>
      <span><strong>Theegget Creations</strong><small>Service status</small></span>
    </div>
    <span class="live-label"><span class="live-dot"></span> LIVE STATUS</span>
  </header>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">EGGSYS · SERVICE HEALTH</p>
      <h1>TCStatus</h1>
      <p class="intro">Current status of the EggSys website.</p>
    </section>
    <section class="status-card" aria-live="polite">
      <div class="status-symbol" id="status-symbol" aria-hidden="true">…</div>
      <div class="status-copy">
        <p class="status-kicker">CURRENT STATUS</p>
        <h2 id="status-title">Loading status…</h2>
        <p id="status-description">Fetching the latest monitoring result.</p>
      </div>
      <span class="status-pill pending" id="status-pill">Checking</span>
    </section>
    <p class="updated-at" id="updated-at">Loading latest update…</p>
    <a class="home-button" href="https://theegget.com" target="_blank" rel="noopener noreferrer">Go Home <span aria-hidden="true">↗</span></a>
    <footer><span>Powered by Theegget Creations</span></footer>
  </main>
</body>
</html>
